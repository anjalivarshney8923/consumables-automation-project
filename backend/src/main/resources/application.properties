# ===================================================================
# Spring Boot Application Configuration
# ===================================================================
spring.application.name=consumables-procurement-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Initial Admin Seeding Configuration
# ===================================================================
app.initial-admin.name=${ADMIN_NAME}
app.initial-admin.email=${ADMIN_EMAIL}
app.initial-admin.password=${ADMIN_PASSWORD}

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
