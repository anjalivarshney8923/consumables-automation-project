# ===================================================================
# Spring Boot Application Configuration
# ===================================================================
spring.application.name=consumables-procurement-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Initial Admin Seeding Configuration
# ===================================================================
app.initial-admin.name=${ADMIN_NAME}
app.initial-admin.email=${ADMIN_EMAIL}
app.initial-admin.password=${ADMIN_PASSWORD}

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===================================================================
# Spring Boot Mail / SMTP Configuration
# ===================================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# Application Alert Email Settings
app.mail.from=${MAIL_FROM}
app.mail.admin-recipient=${ADMIN_ALERT_EMAIL}
app.mail.enabled=${MAIL_ENABLED:true}

